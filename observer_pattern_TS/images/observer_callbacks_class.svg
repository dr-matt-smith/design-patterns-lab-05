<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560">
<defs>
<marker id="open" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11" fill="none" stroke="#000" stroke-width="1.2"/></marker>
<marker id="tri" viewBox="0 0 16 16" refX="15" refY="8" markerWidth="16" markerHeight="16" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L15,8 L1,15 Z" fill="#fff" stroke="#000" stroke-width="1.2"/></marker>
<marker id="filled" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto"><path d="M1,1 L11,6 L1,11 Z" fill="#000"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="20" y="20" width="280" height="130" fill="#A6F78E" stroke="#000" stroke-width="1.2"/>
<text x="160.0" y="37" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" xml:space="preserve">«abstract»</text>
<text x="160.0" y="57" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#000" font-weight="bold" font-style="italic" xml:space="preserve">Subject</text>
<polyline points="20,66 300,66" fill="none" stroke="#000" stroke-width="1.2"/>
<polyline points="20,78 300,78" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="160.0" y="95" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ attach(fn: Listener): () =&gt; void</text>
<text x="160.0" y="111" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ detach(fn: Listener)</text>
<text x="160.0" y="127" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ notify()</text>
<text x="160.0" y="143" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" font-style="italic" xml:space="preserve">+ getState(): number</text>
<rect x="520" y="20" width="230" height="82" fill="#CCFFFF" stroke="#000" stroke-width="1.2"/>
<text x="635.0" y="37" font-family="Helvetica, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#000" xml:space="preserve">«type»</text>
<text x="635.0" y="57" font-family="Helvetica, Arial, sans-serif" font-size="15" text-anchor="middle" fill="#000" font-weight="bold" xml:space="preserve">Listener</text>
<polyline points="520,66 750,66" fill="none" stroke="#000" stroke-width="1.2"/>
<polyline points="520,78 750,78" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="635.0" y="95" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">(state: number) =&gt; void</text>
<polyline points="300,72 520,72" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#open)"/>
<text x="308" y="66" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">listeners</text>
<text x="508" y="66" font-family="Helvetica, Arial, sans-serif" font-size="13" text-anchor="end" fill="#000" xml:space="preserve">*</text>
<polyline points="320,182 300,140" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4"/>
<path d="M320,170 L582.2,170 L592.2,180 L592.2,232 L320,232 Z" fill="#FFFFC4" stroke="#666" stroke-width="1"/>
<path d="M582.2,170 L582.2,180 L592.2,180" fill="none" stroke="#666" stroke-width="1"/>
<text x="332" y="190" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">notify():</text>
<text x="332" y="206" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">  for (const fn of this.listeners)</text>
<text x="332" y="222" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">      fn(this.getState());</text>
<rect x="20" y="330" width="280" height="94" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="160.0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000" font-weight="bold" xml:space="preserve">Subject1</text>
<polyline points="20,360 300,360" fill="none" stroke="#000" stroke-width="1.2"/>
<polyline points="20,384 300,384" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="160.0" y="377" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">- state: number</text>
<text x="160.0" y="401" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ getState(): number</text>
<text x="160.0" y="417" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ setState(n: number)</text>
<rect x="520" y="330" width="230" height="78" fill="#ffffff" stroke="#000" stroke-width="1.2"/>
<text x="635.0" y="350" font-family="Helvetica, Arial, sans-serif" font-size="14" text-anchor="middle" fill="#000" font-weight="bold" xml:space="preserve">Display1</text>
<polyline points="520,360 750,360" fill="none" stroke="#000" stroke-width="1.2"/>
<polyline points="520,384 750,384" fill="none" stroke="#000" stroke-width="1.2"/>
<text x="635.0" y="377" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">- text: string</text>
<text x="635.0" y="401" font-family="Helvetica, Arial, sans-serif" font-size="12.5" text-anchor="middle" fill="#000" xml:space="preserve">+ show(state: number)</text>
<polyline points="160,330 160,150" fill="none" stroke="#000" stroke-width="1.2" marker-end="url(#tri)"/>
<polyline points="520,375 300,375" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#open)"/>
<text x="410" y="367" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#000" xml:space="preserve">attaches a function</text>
<polyline points="635,450 635,408" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4"/>
<path d="M400,450 L706.0,450 L716.0,460 L716.0,528 L400,528 Z" fill="#FFFFC4" stroke="#666" stroke-width="1"/>
<path d="M706.0,450 L706.0,460 L716.0,460" fill="none" stroke="#666" stroke-width="1"/>
<text x="412" y="470" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">// Display1 - no &#x27;implements Observer&#x27;</text>
<text x="412" y="486" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">constructor(s: Subject1){</text>
<text x="412" y="502" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">    s.attach(state =&gt; this.show(state));</text>
<text x="412" y="518" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">}</text>
<polyline points="160,460 160,424" fill="none" stroke="#000" stroke-width="1.2" stroke-dasharray="5,4"/>
<path d="M20,460 L311.4,460 L321.4,470 L321.4,506 L20,506 Z" fill="#FFFFC4" stroke="#666" stroke-width="1"/>
<path d="M311.4,460 L311.4,470 L321.4,470" fill="none" stroke="#666" stroke-width="1"/>
<text x="32" y="480" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">// ... or any function will do</text>
<text x="32" y="496" font-family="Menlo, Consolas, monospace" font-size="12" text-anchor="start" fill="#000" xml:space="preserve">s.attach(state =&gt; console.log(state));</text>
